<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name | Portfolio</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #111827;
      --card: rgba(255, 255, 255, 0.05);
      --card-strong: rgba(255, 255, 255, 0.08);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #7c3aed;
      --secondary: #22d3ee;
      --accent: #f59e0b;
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124, 58, 237, 0.25), transparent 30%),
        radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.18), transparent 25%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(1100px, 90%);
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(14px);
      background: rgba(11, 16, 32, 0.7);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .logo span {
      color: var(--secondary);
    }

    .nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 700;
      transition: 0.2s ease;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.04);
    }

    section {
      padding: 90px 0;
    }

    .hero {
      min-height: 82vh;
      display: flex;
      align-items: center;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
      gap: 50px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(124, 58, 237, 0.3);
      color: #d8b4fe;
      font-size: 0.8rem;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(2.8rem, 6vw, 5rem);
      line-height: 1.05;
      letter-spacing: -0.05em;
      margin-bottom: 18px;
    }

    h1 .highlight {
      background: linear-gradient(90deg, var(--secondary), var(--primary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.08rem;
      max-width: 600px;
      margin-bottom: 28px;
    }

    .hero-actions {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .hero-meta {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .hero-meta strong {
      color: var(--text);
      display: block;
      font-size: 1.25rem;
      margin-bottom: 4px;
    }

    .profile-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .profile-card::before {
      content: "";
      position: absolute;
      inset: -30% auto auto -20%;
      width: 180px;
      height: 180px;
      background: rgba(34, 211, 238, 0.22);
      filter: blur(30px);
      border-radius: 50%;
    }

    .profile-box {
      position: relative;
      background:
        linear-gradient(135deg, rgba(124,58,237,0.4), rgba(34,211,238,0.16)),
        rgba(255,255,255,0.02);
      border-radius: 22px;
      min-height: 420px;
      display: flex;
      align-items: end;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .avatar {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c4b5fd, #67e8f9);
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111827;
      font-size: 5rem;
      font-weight: 800;
      box-shadow: 0 25px 40px rgba(0,0,0,0.25);
      border: 5px solid rgba(255,255,255,0.25);
    }

    .mini-card {
      position: absolute;
      bottom: 18px;
      left: 18px;
      right: 18px;
      background: rgba(11,16,32,0.72);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 18px;
      backdrop-filter: blur(12px);
    }

    .mini-card small {
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    .mini-card strong {
      font-size: 1.1rem;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-heading h2 {
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    .section-heading p {
      color: var(--muted);
      max-width: 620px;
      margin: 0 auto;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: center;
    }

    .about-text {
      color: var(--muted);
      font-size: 1.02rem;
    }

    .about-text p + p {
      margin-top: 18px;
    }

    .info-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: var(--shadow);
    }

    .info-list {
      display: grid;
      gap: 18px;
      margin-top: 20px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .info-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .info-item span {
      color: var(--muted);
    }

    .info-item strong {
      color: var(--text);
      font-weight: 600;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 22px;
    }

    .skill-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 26px 20px;
      text-align: center;
      transition: 0.2s ease;
      box-shadow: var(--shadow);
    }

    .skill-card:hover {
      transform: translateY(-6px);
      border-color: rgba(124,58,237,0.35);
    }

    .skill-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(34,211,238,0.15));
      font-size: 1.5rem;
      color: #e9d5ff;
    }

    .skill-card h3 {
      font-size: 1.06rem;
      margin-bottom: 8px;
    }

    .skill-card p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(250px, 1fr));
      gap: 26px;
    }

    .project-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: 0.2s ease;
    }

    .project-card:hover {
      transform: translateY(-6px);
      border-color: rgba(34,211,238,0.35);
    }

    .project-thumb {
      height: 200px;
      background: linear-gradient(135deg, rgba(124,58,237,0.5), rgba(34,211,238,0.4));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      color: white;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .project-body {
      padding: 24px;
    }

    .project-body h3 {
      margin-bottom: 8px;
      font-size: 1.25rem;
    }

    .project-body p {
      color: var(--muted);
      margin-bottom: 18px;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tag {
      background: rgba(255,255,255,0.04);
      color: #d1d5db;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 0.75rem;
    }

    .project-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--secondary);
      font-weight: 600;
    }

    .contact-box {
      background: linear-gradient(135deg, rgba(124,58,237,0.18), rgba(34,211,238,0.08));
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 42px 30px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .contact-box h2 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      margin-bottom: 14px;
      letter-spacing: -0.04em;
    }

    .contact-box p {
      max-width: 620px;
      margin: 0 auto 26px;
      color: var(--muted);
    }
