<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Your Name — Portfolio</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b1220;
      --surface:#0f1724;
      --muted:#9aa6b2;
      --text:#e6eef6;
      --accent:#7c3aed;      /* purple */
      --accent-2:#06b6d4;    /* teal */
      --glass: rgba(255,255,255,0.03);
      --glass-2: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.06);
      --radius: 12px;
      --shadow-lg: 0 20px 40px rgba(3,7,18,0.7);
      --max-width: 1100px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:
        radial-gradient(800px 400px at 10% 10%, rgba(124,58,237,0.06), transparent 10%),
        radial-gradient(600px 300px at 95% 90%, rgba(6,182,212,0.04), transparent 8%),
        var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.45;
      -webkit-tap-highlight-color: transparent;
    }

    a{color:inherit;text-decoration:none;}
    .container{max-width:var(--max-width);margin:0 auto;padding:0 24px;}

    /* Header */
    header{
      position:sticky;top:0;z-index:40;
      backdrop-filter: blur(8px);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-bottom: 1px solid var(--border);
    }
    .nav{
      display:flex;align-items:center;justify-content:space-between;height:72px;
    }
    .brand{display:flex;gap:12px;align-items:center}
    .logo{
      display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;
    }
    .logo .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 18px rgba(124,58,237,0.18)}
    nav.primary{display:flex;gap:22px;align-items:center;color:var(--muted);font-weight:600;font-size:0.95rem}
    nav.primary a:hover{color:var(--text);opacity:0.95}
    .cta{padding:10px 16px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 10px 30px rgba(124,58,237,0.15);font-weight:700;color:white;font-size:0.9rem}

    /* Mobile */
    .hamburger{display:none;width:44px;height:44px;align-items:center;justify-content:center;border-radius:8px;background:transparent;border:1px solid transparent}
    .hamburger svg{opacity:0.9}
    @media (max-width:900px){
      nav.primary{display:none}
      .hamburger{display:flex}
    }

    /* Hero */
    .hero{
      padding:80px 0 40px;
      display:grid;
      grid-template-columns: 1fr 420px;
      gap:36px;
      align-items:center;
    }
    .hero-left h1{
      font-size: clamp(2.2rem, 4.6vw, 3.6rem);
      margin:0 0 14px;
      line-height:1.02;
      letter-spacing:-0.01em;
      font-weight:800;
      color:var(--text);
    }
    .sub{
      color:var(--muted);font-size:1.04rem;margin-bottom:22px;max-width:66ch;
    }
    .links{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
    .btn-outline{padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font-weight:700}
    .btn-primary{padding:10px 16px;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:white;font-weight:700;box-shadow:0 12px 30px rgba(6,182,212,0.06)}

    /* Profile card */
    .profile-card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid var(--border);
      border-radius:18px;
      padding:26px;
      box-shadow:var(--shadow-lg);
      position:relative;overflow:hidden;
    }
    .profile-top{display:flex;gap:14px;align-items:center;margin-bottom:10px}
    .avatar{
      width:84px;height:84px;border-radius:16px;background:linear-gradient(135deg,#151923 0%, rgba(255,255,255,0.02) 100%);
      display:grid;place-items:center;font-weight:800;font-size:1.6rem;color:var(--text);border:1px solid var(--border)
    }
    .profile-info h3{margin:0;font-size:1.05rem}
    .profile-info p{margin:4px 0 0;color:var(--muted);font-size:0.92rem}

    .meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
    .meta{
      background:var(--glass);border:1px solid var(--glass-2);padding:12px;border-radius:10px;text-align:center;
    }
    .meta strong{display:block;font-size:1.05rem;color:var(--text)}

    /* Sections */
    section{padding:64px 0}
    .section-title{display:flex;align-items:end;gap:18px;margin-bottom:28px}
    .section-title h2{margin:0;font-size:1.6rem}
    .section-title p{margin:0;color:var(--muted);font-size:0.95rem}

    /* About + Skills */
    .split{display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start}
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid*
